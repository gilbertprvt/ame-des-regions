<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="L'Âme des Régions : l'Occitanie, terre d'émotions. Découvrez ses 13 départements, ses paysages et son patrimoine.">
  <title>L'Âme des Régions — L'Occitanie, terre d'émotions</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #14202b; }
    body { display: grid; place-items: center; min-height: 100vh; }
    .accueil { position: relative; width: 100%; max-width: 1920px; aspect-ratio: 1536 / 1024; overflow: hidden; }
    .accueil img { display: block; width: 100%; height: 100%; object-fit: contain; }
    /* Zone transparente superposée exactement au bouton rouge du visuel. */
    .bouton-carte { position: absolute; left: 7.1%; top: 65.7%; width: 37.2%; height: 7.6%; border-radius: 999px; cursor: pointer; text-decoration: none; }
    .bouton-carte:focus-visible { outline: 4px solid white; outline-offset: 3px; background: rgba(255,255,255,.14); }
    .bouton-carte:hover { background: rgba(255,255,255,.10); }
    @media (max-width: 650px) {
      body { align-items: start; }
      .accueil { min-height: 100svh; aspect-ratio: auto; }
      .accueil img { width: 100%; height: auto; }
      .bouton-carte { top: auto; /* recalculated from image width, preserving the original button location */
        top: calc(100vw * 1024 / 1536 * .657); height: calc(100vw * 1024 / 1536 * .076); }
    }
  </style>
</head>
<body>
  <main class="accueil">
    <img src="accueil-occitanie.png" alt="L'Âme des Régions : L'Occitane, terre d'émotions. Paysages, patrimoine, traditions et découverte des 13 départements d'Occitanie." width="1536" height="1024">
    <a class="bouton-carte" href="regions/occitanie/carte-occitanie.html" aria-label="Découvrir la carte des 13 départements d'Occitanie" title="Découvrir la carte des départements"></a>
  </main>
</body>
</html>

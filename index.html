<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="L'Âme des Régions : l'Occitanie, terre d'émotions. Découvrez ses 13 départements, ses paysages et son patrimoine.">
  <title>L'Âme des Régions — L'Occitanie, terre d'émotions</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #14202b; }
    body { display: grid; place-items: center; min-height: 100vh; }
    .accueil {
      position: relative; max-width: 1920px; aspect-ratio: 1536 / 1024; overflow: hidden;
      /* la largeur est limitée pour que toute la hauteur tienne dans l'écran */
      width: min(100%, 100vh * 1536 / 1024);
      width: min(100%, 100dvh * 1536 / 1024);
      container-type: inline-size;   /* les tailles en « cqw » suivent la largeur de l'image */
    }
    .accueil img { display: block; width: 100%; height: 100%; object-fit: contain; }

    /* ── Le bouton unique, à l'emplacement de l'ancien bouton rouge (effacé de l'image) ── */
    .boutons {
      position: absolute; left: 4.6%; top: 64.5%;   /* ← position du bouton */
    }
    .bouton {
      display: inline-flex; align-items: center; gap: .8cqw;
      padding: .8cqw 2cqw;                       /* ← taille du bouton */
      font-family: Georgia, "Times New Roman", serif; font-size: 1.5cqw; font-weight: bold;
      letter-spacing: .03em;
      color: #3a1a08; text-decoration: none; white-space: nowrap; cursor: pointer;
      /* fond doré chaud, assorti au coucher de soleil */
      background: linear-gradient(180deg, #FFE0A3 0%, #FAC775 45%, #E9A23B 100%);
      border: 1px solid rgba(255, 240, 210, .9); border-radius: 999px;
      /* liseré rouge occitan + halo lumineux */
      box-shadow:
        0 0 0 2px rgba(20, 12, 6, .25),
        0 0 0 3px rgba(179, 18, 42, .7),
        0 .4cqw 1.2cqw rgba(0, 0, 0, .35);
      text-shadow: 0 1px 0 rgba(255, 245, 220, .6);
      transition: transform .2s, box-shadow .2s, filter .2s;
      animation: halo 4s ease-in-out infinite;
    }

    /* ── Croix occitane (dessinée en SVG, suit la taille du texte) ── */
    .bouton .croix {
      width: 1.7em; height: 1.7em; flex: none;
      filter: drop-shadow(0 1px 0 rgba(255, 245, 220, .7));
      transition: transform .4s;
    }
    .bouton .croix-gauche { margin-left: -.5em; margin-right: .2em; }   /* ← rapproche la croix du bord gauche */
    .bouton .croix-droite { margin-right: -.5em; margin-left: .2em; }   /* ← rapproche la croix du bord droit */
    .bouton:hover .croix-gauche { transform: rotate(45deg); }
    .bouton:hover .croix-droite { transform: rotate(-45deg); }
    .bouton:hover {
      transform: translateY(-1px) scale(1.03);
      filter: brightness(1.06);
      box-shadow:
        0 0 0 2px rgba(20, 12, 6, .3),
        0 0 0 3px rgba(179, 18, 42, .95),
        0 .6cqw 1.6cqw rgba(0, 0, 0, .4),
        0 0 2cqw rgba(250, 199, 117, .6);
    }
    .bouton:focus-visible { outline: 3px solid #fff; outline-offset: 6px; }

    /* léger halo qui « respire » pour attirer l'œil */
    @keyframes halo {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(250, 199, 117, 0)); }
      50%      { filter: drop-shadow(0 0 .6cqw rgba(250, 199, 117, .45)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bouton { animation: none; transition: none; }
    }

    /* ── Mention discrète « réalisé avec l'IA », coin bas droit ── */
    .mention-ia {
      position: absolute; right: 1.6%; bottom: 1.2%; margin: 0;
      font-family: Georgia, "Times New Roman", serif; font-style: italic;
      font-size: max(9.5px, .78cqw); letter-spacing: .02em;            /* ← taille de la mention */
      color: rgba(255, 248, 232, .72);
      text-shadow: 0 1px 2px rgba(0, 0, 0, .75);
      pointer-events: none; user-select: none;
    }

    @media (max-width: 650px) {
      .mention-ia { font-size: 10px; right: 10px; bottom: 8px; }
      body { align-items: start; }
      .accueil { min-height: 100svh; aspect-ratio: auto; }
      .accueil img { width: 100%; height: auto; }
      /* même emplacement, recalculé à partir de la largeur de l'image */
      .boutons { top: calc(100vw * 1024 / 1536 * .635); left: 4%; }
      .bouton {
        font-size: 12px; padding: 5px 13px; gap: 5px;
        box-shadow: 0 0 0 1px rgba(20, 12, 6, .25), 0 0 0 2px rgba(179, 18, 42, .7), 0 2px 6px rgba(0, 0, 0, .35);
      }
    }
  </style>
</head>
<body>
  <main class="accueil">
    <img src="accueil-occitanie-sans-bouton.webp" alt="L'Âme des Régions : L'Occitanie, terre d'émotions. Paysages, patrimoine, traditions et découverte des 13 départements d'Occitanie." width="1536" height="1024">
    <nav class="boutons" aria-label="Découvrir l'Occitanie">
      <a class="bouton" href="regions/occitanie/carte-occitanie.html" title="Découvrir la carte des 13 départements">
        <svg class="croix croix-gauche" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <!-- une branche : évasée, à pointes, avec 3 pommeaux -->
            <g id="branche">
              <path d="M45 48 Q42 33 29 24 Q42 21 50 11 Q58 21 71 24 Q58 33 55 48 Z"/>
              <circle cx="29" cy="23.5" r="5.2"/>
              <circle cx="50" cy="8.5"  r="5.2"/>
              <circle cx="71" cy="23.5" r="5.2"/>
            </g>
            <!-- la croix complète, réutilisée à gauche et à droite du bouton -->
            <g id="croix-occitane">
              <g fill="#C8102E" stroke="#8a0a1f" stroke-width="1.2">
                <use href="#branche"/>
                <use href="#branche" transform="rotate(90 50 50)"/>
                <use href="#branche" transform="rotate(180 50 50)"/>
                <use href="#branche" transform="rotate(270 50 50)"/>
                <circle cx="50" cy="50" r="8"/>
              </g>
              <!-- « vidée » : le cœur et les branches laissent voir le fond doré -->
              <g fill="#FAC775">
                <circle cx="50" cy="50" r="3.2"/>
                <path d="M50 18 Q53 24 55 26 Q51 34 50 44 Q49 34 45 26 Q47 24 50 18 Z"/>
                <path d="M50 18 Q53 24 55 26 Q51 34 50 44 Q49 34 45 26 Q47 24 50 18 Z" transform="rotate(90 50 50)"/>
                <path d="M50 18 Q53 24 55 26 Q51 34 50 44 Q49 34 45 26 Q47 24 50 18 Z" transform="rotate(180 50 50)"/>
                <path d="M50 18 Q53 24 55 26 Q51 34 50 44 Q49 34 45 26 Q47 24 50 18 Z" transform="rotate(270 50 50)"/>
              </g>
            </g>
          </defs>
          <use href="#croix-occitane"/>
        </svg>
        Carte des départements <svg class="croix croix-droite" viewBox="0 0 100 100" aria-hidden="true"><use href="#croix-occitane"/></svg>
      </a>
    </nav>
    <p class="mention-ia">Textes et illustrations créés avec l'aide de l'intelligence artificielle</p>
  </main>
</body>
</html>
